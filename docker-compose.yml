# Local development stack.
#
# Postgres, Redis and MinIO only. The API and the frontend run on the host so a reload is
# instant — containerising them buys nothing during development and costs a rebuild on
# every edit.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accountingai
      POSTGRES_PASSWORD: accountingai
      POSTGRES_DB: accountingai
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountingai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Documents never go in the database. MinIO stands in for S3 locally so the storage
  # code path in development is the same one that runs in production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
